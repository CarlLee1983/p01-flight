<!doctype html>
<html lang="zh-Hant">
  <meta charset="utf-8" /><meta
    name="viewport"
    content="width=device-width,initial-scale=1"
  /><title>Boss 動作與部件檢查</title
  ><style>
    body {
      background: #101822;
      color: #eee;
      font: 16px system-ui;
      margin: 12px;
    }
    button,
    select {
      font: inherit;
      margin: 4px;
      padding: 8px;
    }
    canvas {
      max-width: 100%;
      height: auto;
    }
    #game {
      width: min(360px, 100%);
    }
    p {
      max-width: 620px;
    }
  </style>
  <h1>Boss 動作與部件檢查</h1>
  <p>
    開發用隔離場景，沿用正式模型與繪圖。不是通關驗證；下方可切換階段與損傷，方向鍵移動玩家。
  </p>
  <label
    >機體<select id="rig">
      <option value="command">第一關 指揮艦</option>
      <option value="riverFortress">第二關 河艦</option>
      <option value="polarRadar">第三關 雷眼</option>
    </select></label
  ><label
    >階段<select id="phase">
      <option>1</option>
      <option>2</option>
      <option>3</option>
    </select></label
  ><button id="break">擊破一個部件</button
  ><button id="reset">重新出場</button>
  <p id="status"></p>
  <div id="game"></div>
  <script type="module" src="./boss-studio.ts"></script>
</html>
